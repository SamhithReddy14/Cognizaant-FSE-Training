<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 18 - JavaScript Plugins</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Modal</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
      Open Modal
    </button>

    <div class="modal fade" id="myModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Modal Title</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">This is a Bootstrap modal.</div>
        </div>
      </div>
    </div>

    <h1 class="mt-5">Accordion</h1>
    <div class="accordion" id="acc">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#one">
            Question 1
          </button>
        </h2>
        <div id="one" class="accordion-collapse collapse show" data-bs-parent="#acc">
          <div class="accordion-body">This is the answer.</div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#two">
            Question 2
          </button>
        </h2>
        <div id="two" class="accordion-collapse collapse" data-bs-parent="#acc">
          <div class="accordion-body">This is another answer.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
