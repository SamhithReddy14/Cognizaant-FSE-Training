<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 5 - Alignment and Reorder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Center Content</h1>
    <div class="row justify-content-center align-items-center bg-light" style="height: 200px;">
      <div class="col-6 bg-primary text-white p-3 text-center">Centered Content</div>
    </div>

    <h1 class="mt-4">Reorder Columns</h1>
    <div class="row">
      <div class="col-md-6 order-md-2 bg-warning p-3">First on mobile, second on desktop</div>
      <div class="col-md-6 order-md-1 bg-info p-3">Second on mobile, first on desktop</div>
    </div>
  </div>
</body>
</html>
