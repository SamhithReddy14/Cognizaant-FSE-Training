<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 16 - Positioning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="pb-5">
  <div class="container mt-4">
    <h1>Badge Over Image</h1>
    <div class="position-relative d-inline-block">
      <img src="https://via.placeholder.com/200" alt="Product">
      <span class="position-absolute top-0 start-100 translate-middle badge bg-danger">New</span>
    </div>
  </div>

  <footer class="position-fixed bottom-0 w-100 bg-dark text-white text-center p-2">
    Fixed Footer
  </footer>
</body>
</html>
