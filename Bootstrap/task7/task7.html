<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 7 - Typography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1 class="display-1">Display Heading</h1>
    <p class="lead">This is lead text.</p>
    <p class="text-muted">This is muted text.</p>
    <p class="fw-bold">This is bold text.</p>
    <p class="text-uppercase">uppercase text</p>
    <p class="text-lowercase">LOWERCASE TEXT</p>
    <p class="text-capitalize">capitalized text example</p>
  </div>
</body>
