<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 11 - Cards and Media</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Profile Card</h1>
    <div class="card mb-4" style="width: 18rem;">
      <img src="https://via.placeholder.com/300x180" class="card-img-top" alt="Profile">
      <div class="card-body">
        <h5 class="card-title">John Doe</h5>
        <p class="card-text">Web Developer</p>
      </div>
    </div>

    <h1>Media Layout</h1>
    <div class="d-flex">
      <img src="https://via.placeholder.com/100" class="me-3" alt="Media">
      <div>
        <h5>Media Title</h5>
        <p>This is content placed beside an image.</p>
      </div>
    </div>
  </div>
</body>
</html>
