<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 14 - Display</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <div class="d-none d-md-block bg-info p-3 mb-3">
      This box is visible from medium screens.
    </div>

    <div class="d-none d-lg-flex bg-warning p-3 mb-3">
      This box is flex only on large screens.
    </div>

    <div class="row">
      <div class="d-none d-md-block col-md-3 bg-light p-3">Sidebar</div>
      <div class="col-md-9 bg-secondary text-white p-3">Content Area</div>
    </div>
  </div>
</body>
</html>
