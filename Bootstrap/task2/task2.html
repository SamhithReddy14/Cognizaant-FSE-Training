<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Bootstrap Files</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Bootstrap Structure</h1>
    <ul class="list-group">
      <li class="list-group-item"><b>css folder:</b> Contains Bootstrap style files.</li>
      <li class="list-group-item"><b>js folder:</b> Contains Bootstrap JavaScript plugins.</li>
      <li class="list-group-item"><b>icons folder:</b> Contains Bootstrap icon files.</li>
    </ul>

    <button class="btn btn-primary mt-4" data-bs-toggle="collapse" data-bs-target="#demo">
      Test Bootstrap JavaScript
    </button>
    <div class="collapse mt-3" id="demo">
      <div class="card card-body">bootstrap.bundle.min.js is working.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
