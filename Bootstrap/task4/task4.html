<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 4 - Column Layouts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Sidebar and Content</h1>
    <div class="row mb-4">
      <div class="col-md-3 bg-light p-3">Sidebar</div>
      <div class="col-md-9 bg-secondary text-white p-3">Main Content</div>
    </div>

    <h1>Four Equal Columns</h1>
    <div class="row">
      <div class="col-sm-3 bg-primary text-white p-3">One</div>
      <div class="col-sm-3 bg-success text-white p-3">Two</div>
      <div class="col-sm-3 bg-warning p-3">Three</div>
      <div class="col-sm-3 bg-danger text-white p-3">Four</div>
    </div>
  </div>
</body>
</html>
