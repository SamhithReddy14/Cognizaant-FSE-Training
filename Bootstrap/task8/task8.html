<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 8 - Forms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1>Registration Form</h1>
    <form class="mb-5">
      <input class="form-control mb-3" type="text" placeholder="Full Name">
      <input class="form-control mb-3" type="email" placeholder="Email">
      <div class="input-group mb-3">
        <span class="input-group-text">+91</span>
        <input class="form-control" type="text" placeholder="Phone Number">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agree">
        <label class="form-check-label" for="agree">I agree to the terms</label>
      </div>
      <button class="btn btn-success">Register</button>
    </form>

    <h1>Login Form</h1>
    <form>
      <div class="form-floating mb-3">
        <input class="form-control" id="email" type="email" placeholder="Email">
        <label for="email">Email</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" id="password" type="password" placeholder="Password">
        <label for="password">Password</label>
      </div>
      <button class="btn btn-primary">Login</button>
    </form>
  </div>
</body>
</html>
