<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Events Gallery</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }

        td {
            padding: 15px;
        }

        .event-image {
            width: 220px;
            height: 150px;
            border: 4px solid #2f6f73;
            object-fit: cover;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .event-caption {
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Image Gallery for Community Events</h1>

    <table>
        <caption>Past Community Event Highlights</caption>
        <tr>
            <td>
                <img src="images/community-cleanup.jpg" alt="Volunteers cleaning a community park" title="Community Cleanup Drive" class="event-image">
                <p class="event-caption">Community Cleanup Drive</p>
            </td>
            <td>
                <img src="images/food-festival.jpg" alt="People enjoying food stalls at a festival" title="Food Festival" class="event-image">
                <p class="event-caption">Food Festival</p>
            </td>
            <td>
                <img src="images/music-night.jpg" alt="Musicians performing at an outdoor event" title="Music Night" class="event-image">
                <p class="event-caption">Music Night</p>
            </td>
        </tr>
        <tr>
            <td>
                <img src="images/tree-plantation.jpg" alt="Residents planting trees together" title="Tree Plantation" class="event-image">
                <p class="event-caption">Tree Plantation</p>
            </td>
            <td>
                <img src="images/art-workshop.jpg" alt="Children painting during an art workshop" title="Art Workshop" class="event-image">
                <p class="event-caption">Art Workshop</p>
            </td>
            <td>
                <img src="images/sports-day.jpg" alt="Community members participating in sports day" title="Sports Day" class="event-image">
                <p class="event-caption">Sports Day</p>
            </td>
        </tr>
    </table>
</body>
</html>
