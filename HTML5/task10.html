<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugging with Chrome DevTools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f8;
            padding: 30px;
        }

        .event-card {
            width: 320px;
            background-color: white;
            border: 1px solid #cccccc;
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            color: #284b63;
        }

        button {
            padding: 10px 15px;
            background-color: #2f6f73;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #256029;
        }
    </style>
</head>
<body>
    <div class="event-card">
        <h1>Debugging Demo</h1>
        <p>Use Inspect Element to change this card style live.</p>

        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" value="2">

        <br><br>

        <button onclick="calculateTotal()">Calculate Total</button>

        <p id="result"></p>
    </div>

    <script>
        console.log("Page loaded successfully.");

        function calculateTotal() {
            const ticketPrice = 150;
            const tickets = document.getElementById("tickets").value;
            const total = ticketPrice * tickets;

            console.log("Ticket price:", ticketPrice);
            console.log("Number of tickets:", tickets);
            console.log("Total amount:", total);

            document.getElementById("result").innerHTML = "Total amount: Rs. " + total;
        }
    </script>
</body>
</html>
