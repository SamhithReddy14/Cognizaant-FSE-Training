<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Invite</title>
</head>
<body>
    <h1>Event Promo Video</h1>

    <video width="500" controls oncanplay="showVideoMessage()">
        <source src="event-promo.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <p id="videoMessage"></p>

    <h2>Event Form</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" oninput="formStarted = true">
    </form>

    <script>
        let formStarted = false;

        function showVideoMessage() {
            document.getElementById("videoMessage").innerHTML = "Video ready to play";
        }

        window.onbeforeunload = function() {
            if (formStarted) {
                return "You have unfinished changes on this page.";
            }
        };
    </script>
</body>
</html>
