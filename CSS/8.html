<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model and Layout Control</title>
    <link rel="stylesheet" href="8.css">
</head>
<body>
    <main>
        <section class="eventCard">
            <h1>Box Model Practice</h1>
            <p>This card uses margin, padding, border, and a stable width.</p>
            <label for="email">Email</label>
            <input id="email" class="selected-field" type="email" value="member@example.com">
        </section>

        <p class="hidden-box">This text is hidden but still takes space.</p>
        <p class="none-box">This text is removed from layout.</p>
    </main>
</body>
</html>
