<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Styling</title>
    <link rel="stylesheet" href="7.css">
</head>
<body>
    <main>
        <h1>Events Admin Table</h1>
        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Garden Day</td>
                    <td>June 8</td>
                    <td>Community Park</td>
                    <td>Open</td>
                </tr>
                <tr>
                    <td>Food Drive</td>
                    <td>June 14</td>
                    <td>Town Hall</td>
                    <td>Full</td>
                </tr>
                <tr>
                    <td>Art Workshop</td>
                    <td>June 21</td>
                    <td>Library</td>
                    <td>Open</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
